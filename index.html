<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>README Studio</title><meta name="description" content="Build polished GitHub README files with a live preview."><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#">README<span>Studio</span></a><nav><a href="#editor">Editor</a><a href="#templates">Templates</a><a href="https://github.com/feloony" target="_blank" rel="noreferrer">GitHub</a></nav></header><main><section class="hero"><div><span>GITHUB README BUILDER</span><h1>Make your<br><em>README matter.</em></h1><p>Write structured project documentation with a live GitHub-style preview and one-click Markdown export.</p></div><button id="download" class="hero-btn">Download README.md</button></section><section id="editor" class="studio"><aside><div class="side-head"><b>Project</b><button id="reset">Reset</button></div><label>Name<input id="name" value="My Project"></label><label>Tagline<textarea id="tagline" rows="3">A clean open-source project built for developers.</textarea></label><label>Description<textarea id="desc" rows="5">Explain what your project does, why it exists, and who it is for.</textarea></label><label>Install command<input id="install" value="npm install my-project"></label><label>Usage<textarea id="usage" rows="4">import { project } from "my-project";</textarea></label><label>License<select id="license"><option>MIT</option><option>Apache-2.0</option><option>GPL-3.0</option></select></label></aside><article class="preview"><div class="previewbar"><b>Preview</b><span>GitHub Markdown</span></div><div id="render"></div></article></section><section id="templates" class="templates"><h2>Starter templates</h2><div class="template-grid"><button data-template="library">Library</button><button data-template="app">Application</button><button data-template="tool">Developer Tool</button></div></section></main><script src="app.js"></script></body></html>
